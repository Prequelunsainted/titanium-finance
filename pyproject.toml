[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "titanium-finance"
version = "2.0.0"
description = "Controle financeiro pessoal para desktop, com painel, gráficos e orçamentos."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["customtkinter>=5.2", "pillow>=10.0", "matplotlib>=3.7"]

[project.scripts]
titanium = "titanium.__main__:main"

[tool.setuptools]
packages = ["titanium"]

[tool.setuptools.package-data]
titanium = ["assets/*.png"]
