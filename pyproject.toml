[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "titanus-finance-control"
version = "2.0.0"
description = "Controle financeiro pessoal para desktop, com painel, gráficos e orçamentos."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["customtkinter>=5.2", "pillow>=10.0", "matplotlib>=3.7"]

[project.scripts]
titanus = "titanus.__main__:main"

[tool.setuptools]
packages = ["titanus"]

[tool.setuptools.package-data]
titanus = ["assets/*.png"]
